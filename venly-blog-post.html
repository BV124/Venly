<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red: #e03a2f; --red-light: #fdf0ef; --red-dark: #c2332a;
  --text: #1a1a1a; --text-muted: #6b6b6b; --border: #e8e8e8;
  --bg: #f7f7f5; --white: #fff; --radius: 12px; --radius-sm: 8px;
}
body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--white); font-size: 15px; line-height: 1.6; }
nav { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 48px; height: 64px; }
.logo { font-size: 22px; font-weight: 700; color: var(--red); letter-spacing: -0.5px; text-decoration: none; }
.nav-links { display: flex; gap: 36px; list-style: none; }
.nav-links a { color: var(--text); font-size: 14px; text-decoration: none; transition: color 0.15s; }
.nav-links a:hover { color: var(--red); }
.nav-right { display: flex; gap: 12px; }
.btn { border-radius: var(--radius-sm); padding: 9px 22px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; border: 2px solid var(--red); transition: all 0.15s; }
.btn-outline { background: transparent; color: var(--red); }
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); }

/* BREADCRUMB */
.breadcrumb { padding: 14px 64px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
.breadcrumb a { color: var(--text-muted); text-decoration: none; transition: color 0.15s; }
.breadcrumb a:hover { color: var(--red); }

/* HERO IMAGE */
.post-hero { max-width: 1100px; margin: 0 auto; padding: 32px 64px 0; }
.post-hero img { width: 100%; height: 420px; object-fit: cover; display: block; border-radius: 16px; }

/* LAYOUT */
.post-wrap { max-width: 1100px; margin: 0 auto; padding: 48px 64px 80px; display: grid; grid-template-columns: 1fr 300px; gap: 60px; align-items: start; }

/* ARTICLE */
.post-cat { display: inline-block; background: var(--red-light); color: var(--red); font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px; border: 1px solid #f5c4bf; }
.post-title { font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1.15; margin-bottom: 16px; }
.post-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-muted); margin-bottom: 32px; padding-bottom: 32px; border-bottom: 1px solid var(--border); }
.post-meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border); }
.post-body { font-size: 16px; line-height: 1.85; color: #2a2a2a; }
.post-body h2 { font-size: 22px; font-weight: 700; margin: 36px 0 14px; letter-spacing: -0.3px; }
.post-body h3 { font-size: 18px; font-weight: 600; margin: 28px 0 12px; }
.post-body p { margin-bottom: 16px; line-height: 1.75; }
.post-body p:last-child { margin-bottom: 0; }
.post-body ul, .post-body ol { margin: 0 0 20px 24px; }
.post-body li { margin-bottom: 8px; }
.post-body blockquote { border-left: 4px solid var(--red); padding: 16px 20px; background: var(--red-light); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 28px 0; font-style: italic; color: var(--text-muted); }
.post-body strong { font-weight: 700; color: var(--text); }

/* SHARE */
.post-share { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.share-label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.share-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; background: transparent; font-family: 'Inter', sans-serif; transition: all 0.15s; }
.share-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }
.share-btn svg { width: 14px; height: 14px; }

/* SIDEBAR */
.sidebar-sticky { position: sticky; top: 80px; }
.sidebar-card { background: var(--bg); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
.sidebar-card h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 16px; }
.related-post { display: flex; gap: 12px; margin-bottom: 16px; cursor: pointer; padding-bottom: 16px; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; }
.related-post:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.related-img { width: 64px; height: 64px; border-radius: var(--radius-sm); overflow: hidden; flex-shrink: 0; }
.related-img img { width: 100%; height: 100%; object-fit: cover; }
.related-title { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
.related-cat { font-size: 11px; color: var(--text-muted); }
.cta-card { background: var(--red); color: #fff; border-radius: var(--radius); padding: 24px; text-align: center; }
.cta-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.cta-card p { font-size: 13px; opacity: 0.85; margin-bottom: 16px; line-height: 1.5; }
.btn-white { background: #fff; color: var(--red); border: none; border-radius: var(--radius-sm); padding: 10px 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; width: 100%; transition: all 0.15s; }
.btn-white:hover { background: var(--red-light); }

/* MORE POSTS */
.more-posts { background: var(--bg); padding: 60px 64px; }
.more-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.more-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }
.more-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1100px; margin: 0 auto; }
.blog-card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
.blog-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,0.09); }
.blog-card-img { height: 180px; overflow: hidden; position: relative; }
.blog-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
.blog-card:hover .blog-card-img img { transform: scale(1.04); }
.card-cat-badge { position: absolute; bottom: 10px; left: 10px; background: rgba(255,255,255,0.92); font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
.blog-card-body { padding: 16px; }
.blog-card-title { font-size: 14px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; }
.blog-card-excerpt { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; }
.read-more { font-size: 12px; font-weight: 600; color: var(--red); display: flex; align-items: center; gap: 4px; }

/* FOOTER */
footer { background: #111; color: #fff; }

/* MOBILE */
@media (max-width: 900px) {
  .post-wrap { grid-template-columns: 1fr; padding: 32px 24px 60px; gap: 32px; }
  .breadcrumb { padding: 12px 24px; }
  .post-title { font-size: 26px; }
  .post-body { font-size: 15px; }
  .more-posts { padding: 40px 24px; }
  .more-grid { grid-template-columns: 1fr 1fr; }
  nav { padding: 0 20px; }
}
@media (max-width: 600px) {
  .post-hero { padding: 20px 24px 0; }
  .post-hero img { height: 240px; border-radius: 12px; }
  .post-title { font-size: 22px; }
  .more-grid { grid-template-columns: 1fr; }
  .nav-links { display: none; }
}
</style>

<script>
// Converts a post's structured content blocks (paragraph/heading/quote/
// list) into HTML — mirrors blocksToHtml() in venly-admin.html exactly,
// so a post renders identically here and in the admin's live preview.
function blocksToHtml(blocks) {
  if (!blocks || blocks.length === 0) return '';
  return blocks.map(function(b) {
    if (b.type === 'paragraph') {
      // Use stored HTML (preserves bold/italic/underline) — fall back to escaped plain text
      var content = b.html || (b.text ? escapeHtmlBlog(b.text).replace(/\n/g, '<br>') : '');
      return content ? '<p>' + content + '</p>' : '';
    }
    if (b.type === 'heading') {
      return b.text ? '<h2>' + escapeHtmlBlog(b.text) + '</h2>' : '';
    }
    if (b.type === 'quote') {
      return b.text ? '<blockquote>' + escapeHtmlBlog(b.text) + '</blockquote>' : '';
    }
    if (b.type === 'list') {
      var items = (b.items || []).filter(function(i) { return i && i.trim(); });
      if (items.length === 0) return '';
      return '<ul>' + items.map(function(i) { return '<li>' + escapeHtmlBlog(i) + '</li>'; }).join('') + '</ul>';
    }
    return '';
  }).join('');
}

function blogPostUrl(p) {
  return 'venly-blog-post.html?' + (p.slug ? 'slug=' + encodeURIComponent(p.slug) : 'id=' + p.id);
}

function escapeHtmlBlog(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function formatBlogDate(iso) {
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var d = iso ? new Date(iso) : new Date();
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

// Real posts, once bootstrapped — mapped into the same {id, title, cat,
// date, read, img, body} shape DEMO_POSTS already uses.
function getPostsForDisplay() {
  var real = (typeof getVenlyBlogPosts === 'function') ? getVenlyBlogPosts() : null;
  if (!real) return DEMO_POSTS;
  return real
    .filter(function(p) { return p.title; })
    .map(function(p) {
      return {
        id: p.id,
        title: p.title,
        cat: p.category,
        date: formatBlogDate(p.createdAt),
        read: p.readTime,
        img: p.img,
        excerpt: p.excerpt || '',
        body: (p.blocks && p.blocks.length > 0) ? blocksToHtml(p.blocks) : (p.content || ''),
      };
    });
}

// Upgrade image quality for hero display — replaces low-res params
// with high-res ones for Unsplash URLs, or returns the URL as-is for
// Supabase Storage URLs (which are already full quality).
function upgradeImageUrl(url) {
  if (!url) return '';
  // Unsplash: bump to w=1600 q=85
  if (url.indexOf('unsplash.com') !== -1) {
    return url.replace(/[?&]w=\d+/g, '').replace(/[?&]q=\d+/g, '')
      + (url.indexOf('?') === -1 ? '?' : '&') + 'w=1600&q=85';
  }
  return url;
}

// Fast path: fetch just the one post we need directly from Supabase,
// instead of waiting for the full blog list to load. Falls back to the
// full list if the direct fetch fails or we're in demo mode.
async function fastFetchPost(id, slug) {
  if (typeof sb === 'undefined' || !SUPABASE_READY) return null;
  try {
    var query = sb.from('blog_posts').select('*');
    if (slug) query = query.eq('slug', slug);
    else if (id) query = query.eq('id', id);
    else return null;
    var res = await query.single();
    if (res.error || !res.data) return null;
    var row = res.data;
    return {
      id: row.id,
      slug: row.slug || '',
      title: row.title,
      cat: row.category,
      date: formatBlogDate(row.created_at),
      read: row.read_time || '4 min read',
      img: row.cover_image || '',
      excerpt: row.excerpt || '',
      seo_title: row.seo_title || '',
      meta_desc: row.meta_desc || '',
      body: (row.blocks && row.blocks.length > 0) ? blocksToHtml(row.blocks) : (row.content || ''),
    };
  } catch (e) {
    console.error('fastFetchPost failed:', e);
    return null;
  }
}

function loadPost() {
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug');
  var id = params.get('id');

  // Try fast single-post fetch first (by slug if available, else by id)
  var fastPromise = fastFetchPost(id, slug);
  var fullPromise = window.venlyReady.then(function() { return null; });

  Promise.all([fastPromise, fullPromise]).then(function(results) {
    var fastPost = results[0];
    var posts = getPostsForDisplay();
    // Match by slug first, then id, then fall back to first post
    var post = fastPost
      || (slug ? posts.find(function(p) { return p.slug === slug; }) : null)
      || (id ? posts.find(function(p) { return String(p.id) === String(id); }) : null)
      || posts[0];

  if (!post) {
    var fetchFailed = typeof venlyFetchFailed === 'function' && venlyFetchFailed('blog');
    if (fetchFailed && typeof venlyShowLoadError === 'function') venlyShowLoadError();
    document.title = 'Venly — ' + (fetchFailed ? "Couldn't load this post" : 'Post not found');
    document.getElementById('breadcrumb-title').textContent = fetchFailed ? 'Loading error' : 'Not found';
    document.getElementById('post-title').textContent = fetchFailed ? "Couldn't load this post" : 'Post not found';
    document.getElementById('post-cat').textContent = '';
    document.getElementById('post-date').textContent = '';
    document.getElementById('post-read').textContent = '';
    document.getElementById('post-body').innerHTML = '<p>' + (fetchFailed
      ? 'Something went wrong loading this post. Please refresh the page, or try again shortly.'
      : 'This post may have been removed or the link is incorrect. <a href="venly-blog.html">Browse all posts</a> instead.') + '</p>';
    return;
  }

  // Track this page view — fire-and-forget so it never blocks rendering.
  // Uses an atomic increment (update with views = views + 1) so concurrent
  // views from different readers don't clobber each other.
  if (typeof sb !== 'undefined' && SUPABASE_READY && post.id) {
    sb.rpc('increment_blog_views', { post_id: post.id }).then(function(res) {
      if (res.error) console.warn('Blog view tracking failed:', res.error.message);
    });
  }

  document.title = (post.seo_title || post.title) + ' | Venly';
  // Update meta description
  var metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute('content', post.meta_desc || post.excerpt || 'Read this article on the Venly blog — tips, guides, and news about event spaces, meeting rooms, and shoot locations in New Zealand.');
  // Open Graph tags
  var ogTitle = document.querySelector('meta[property="og:title"]');
  if (ogTitle) ogTitle.setAttribute('content', post.seo_title || post.title);
  var ogDesc = document.querySelector('meta[property="og:description"]');
  if (ogDesc) ogDesc.setAttribute('content', post.meta_desc || post.excerpt || '');
  document.getElementById('breadcrumb-title').textContent = post.title;
  document.getElementById('post-hero-img').src = upgradeImageUrl(post.img);
  document.getElementById('post-hero-img').alt = post.title;
  document.getElementById('post-cat').textContent = post.cat;
  document.getElementById('post-title').textContent = post.title;
  document.getElementById('post-date').textContent = post.date;
  document.getElementById('post-read').textContent = post.read;
  document.getElementById('post-body').innerHTML = post.body;

  // Sidebar "More posts" — real posts, excluding current, max 3
  var sidebarPosts = posts.filter(function(p) { return String(p.id) !== String(post.id); }).slice(0, 3);
  document.getElementById('sidebar-posts').innerHTML = sidebarPosts.length === 0
    ? '<p style="font-size:13px;color:var(--text-muted)">No other posts yet.</p>'
    : sidebarPosts.map(function(p) {
      return '<a href="' + blogPostUrl(p) + '" class="related-post">' +
        '<div class="related-img"><img src="' + (p.img || '') + '" alt="" /></div>' +
        '<div><div class="related-title">' + p.title + '</div><div class="related-cat">' + (p.cat || '') + '</div></div>' +
      '</a>';
    }).join('');

  // "Keep reading" grid at bottom — real posts, excluding current, max 3
  var others = posts.filter(function(p) { return String(p.id) !== String(post.id); }).slice(0, 3);
  document.getElementById('more-grid').innerHTML = others.map(function(p) {
    return '<div class="blog-card" onclick="window.location.href=\'' + blogPostUrl(p) + '\'">' +
      '<div class="blog-card-img"><img src="' + p.img + '" alt="' + p.title + '" loading="lazy" />' +
      '<span class="card-cat-badge">' + p.cat + '</span></div>' +
      '<div class="blog-card-body">' +
      '<div class="blog-card-title">' + p.title + '</div>' +
      '<div class="read-more">Read more →</div>' +
      '</div></div>';
  }).join('');

  }); // end Promise.all
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).catch(function(){});
  showToast('Link copied!');
}

loadPost();
</script>
